name: Update profile banner stats

on:
  schedule:
    - cron: '0 4 1 * *'   # monthly, 1st day 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update hardcoded stats in banner SVGs
        uses: actions/github-script@v7
        with:
          script: |
            const user = context.repo.owner;
            const h = { 'user-agent': 'stats-updater' };
            const u = await github.rest.users.getByUsername({ username: user });
            const repos = await github.rest.repos.listForUser({ username: user, per_page: 100 });
            const stars = repos.data.reduce((s, r) => s + r.stargazers_count, 0);
            const commits = await github.request('GET /search/commits', { q: `author:${user} is:public`, per_page: 1, headers: h });
            const stats = { repos: u.data.public_repos, stars, commits: commits.data.total_count, followers: u.data.followers };
            console.log('live stats:', stats);
            const fs = require('fs');

            // Each banner row is three tspans: label (with trailing space), dot-filler,
            // then the value. Fill colors differ per theme, so match structure only.
            // The filler is trimmed/padded so the value column stays aligned when the
            // digit count changes.
            const esc = (t) => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const rows = [
              ['. Repos: ', String(stats.repos)],
              ['. Stars: ', String(stats.stars)],
              ['. Commits: ', String(stats.commits)],
              ['. Followers: ', String(stats.followers)],
            ];
            let changedFiles = 0;
            for (const f of ['dark.svg', 'light.svg']) {
              const original = fs.readFileSync(f, 'utf8');
              let s = original;
              for (const [label, value] of rows) {
                const re = new RegExp('(' + esc(label) + '<\\/tspan><tspan fill="#[0-9a-fA-F]{6}">)([^<]*)(<\\/tspan><tspan fill="#[0-9a-fA-F]{6}">) ?([\\d,]+)(<\\/tspan>)');
                const m = s.match(re);
                if (!m) {
                  console.log(`${f}: no match for "${label}"`);
                  continue;
                }
                const delta = value.length - m[4].length;
                const dots = Math.max(1, m[2].length - delta);
                s = s.replace(re, `$1${'.'.repeat(dots)}$3 ${value}$5`);
              }
              if (s !== original) {
                fs.writeFileSync(f, s);
                changedFiles++;
              }
            }
            console.log('banner files changed:', changedFiles);

            // Bump the README cache busters only when the banners changed, so
            // GitHub Camo re-fetches the refreshed SVGs.
            if (changedFiles > 0) {
              const stamp = 'stats-' + new Date().toISOString().slice(0, 7);
              let readme = fs.readFileSync('README.md', 'utf8');
              readme = readme.replace(/(dark\.svg\?v=)[\w.-]+/g, '$1' + stamp);
              readme = readme.replace(/(light\.svg\?v=)[\w.-]+/g, '$1' + stamp);
              fs.writeFileSync('README.md', readme);
            }

      - name: Create pull request with updated stats
        uses: peter-evans/create-pull-request@3afad46a91e1234a4e2800ffa47bd6c2a6b66b6c
        with:
          branch: stats/auto-update
          delete-branch: true
          title: 'chore(stats): sync banner stats with live GitHub data'
          commit-message: 'chore(stats): sync banner stats with live GitHub data'
          body: |
            Automated monthly sync of the banner stats (repos / stars / commits /
            followers) in `dark.svg` and `light.svg`, plus a README cache-buster
            bump so GitHub Camo serves the refreshed images.

            Generated by the `Update profile banner stats` workflow.
