name: Update profile banner stats

on:
  schedule:
    - cron: '0 4 1 * *'   # monthly, 1st day 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update hardcoded stats in banner SVGs
        uses: actions/github-script@v7
        with:
          script: |
            const user = context.repo.owner;
            const h = { 'user-agent': 'stats-updater' };
            const u = await github.rest.users.getByUsername({ username: user });
            const repos = await github.rest.repos.listForUser({ username: user, per_page: 100 });
            const stars = repos.data.reduce((s, r) => s + r.stargazers_count, 0);
            const commits = await github.request('GET /search/commits', { q: `author:${user} is:public`, per_page: 1, headers: h });
            const stats = { repos: u.data.public_repos, stars, commits: commits.data.total_count, followers: u.data.followers };
            console.log('live stats:', stats);
            const fs = require('fs');
            for (const f of ['dark.svg', 'light.svg']) {
              let s = fs.readFileSync(f, 'utf8');
              s = s.replace(/(\. Repos:<\/tspan><tspan fill="#[0-9a-fA-F]{6}">) \d+(<\/tspan>)/, `$1 ${stats.repos}$2`);
              s = s.replace(/(\. Stars:<\/tspan><tspan fill="#[0-9a-fA-F]{6}">) \d+(<\/tspan>)/, `$1 ${stats.stars}$2`);
              s = s.replace(/(\. Commits:<\/tspan><tspan fill="#[0-9a-fA-F]{6}">) [\d,]+(<\/tspan>)/, `$1 ${stats.commits}$2`);
              s = s.replace(/(\. Followers:<\/tspan><tspan fill="#[0-9a-fA-F]{6}">) \d+(<\/tspan>)/, `$1 ${stats.followers}$2`);
              fs.writeFileSync(f, s);
            }

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark.svg light.svg
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore(stats): sync banner stats with live GitHub data"
            git push
          fi